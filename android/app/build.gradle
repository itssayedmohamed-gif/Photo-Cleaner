plugins { id 'com.android.application' }

android {
    namespace 'dev.photoclean.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.photoclean.app'
        minSdk 30            // MediaStore.createDeleteRequest needs API 30
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
