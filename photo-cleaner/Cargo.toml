[package]
name = "photocleaner"
version = "0.1.0"
edition = "2021"
description = "Swipe-to-clean photo reviewer for Android, written in Rust (egui on NativeActivity)"

[lib]
name = "photocleaner"
crate-type = ["cdylib", "rlib"]

# Android-only dependencies, so `cargo test` for the pure-Rust persistence
# logic (src/store.rs) also works on a normal desktop host.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["android-native-activity", "glow", "default_fonts"] }
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
ndk-context = "0.1"
log = "0.4"
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
